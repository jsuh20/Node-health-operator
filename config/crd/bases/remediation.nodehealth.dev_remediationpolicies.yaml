---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: remediationpolicies.remediation.nodehealth.dev
spec:
  group: remediation.nodehealth.dev
  names:
    kind: RemediationPolicy
    listKind: RemediationPolicyList
    plural: remediationpolicies
    shortNames:
    - rp
    singular: remediationpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.matchingNodes
      name: Matching
      type: integer
    - jsonPath: .status.unhealthyNodes
      name: Unhealthy
      type: integer
    - jsonPath: .status.nodesUnderRemediation
      name: Remediating
      type: integer
    - jsonPath: .status.maxConcurrent
      name: Max
      type: integer
    - jsonPath: .spec.dryRun
      name: DryRun
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RemediationPolicy is the Schema for the remediationpolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RemediationPolicy
            properties:
              drainTimeout:
                default: 5m
                description: |-
                  drainTimeout is how long draining may take (e.g. while a
                  PodDisruptionBudget blocks evictions) before the attempt counts as failed.
                type: string
              dryRun:
                description: |-
                  dryRun makes the controller decide and emit events/logs, but never
                  change nodes or evict pods.
                type: boolean
              maxConcurrent:
                anyOf:
                - type: integer
                - type: string
                default: 1
                description: |-
                  maxConcurrent is the blast-radius cap: the most matching nodes that may
                  be under remediation (or Failed) at once. An integer ("2") or a percent
                  of matching nodes ("25%"). Percentages round down, but never below 1.
                x-kubernetes-int-or-string: true
              nodeSelector:
                description: |-
                  nodeSelector picks the nodes this policy manages. An empty selector
                  matches every node.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              rebootTimeout:
                default: 5m
                description: |-
                  rebootTimeout is how long to wait for the node to come back healthy
                  after a reboot/replace request before the attempt counts as failed.
                type: string
              retry:
                default: {}
                description: retry controls backoff between failed attempts.
                properties:
                  initialBackoff:
                    default: 30s
                    description: |-
                      initialBackoff is the wait after the first failure. It doubles after
                      each further failure, up to maxBackoff.
                    type: string
                  maxAttempts:
                    default: 3
                    description: |-
                      maxAttempts is how many reboot/replace attempts to make before giving up
                      and marking the node Failed (it then stays cordoned for a human).
                    format: int32
                    minimum: 1
                    type: integer
                  maxBackoff:
                    default: 10m
                    description: maxBackoff caps the wait between attempts.
                    type: string
                type: object
              strategy:
                default: Reboot
                description: strategy is the step after cordon and drain.
                enum:
                - Reboot
                - Replace
                type: string
              unhealthyConditions:
                description: |-
                  unhealthyConditions lists the condition values that make a node
                  unhealthy. Matching any one of them is enough.
                items:
                  description: |-
                    UnhealthyCondition says which node condition value counts as "unhealthy".
                    Examples: {type: Ready, status: "False"}, {type: Ready, status: Unknown},
                    {type: GPUHealthy, status: "False"}.
                  properties:
                    status:
                      description: status is the condition status that counts as unhealthy.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type is the node condition type, e.g. Ready, DiskPressure,
                        GPUHealthy.
                      minLength: 1
                      type: string
                  required:
                  - status
                  - type
                  type: object
                minItems: 1
                type: array
              unhealthyDuration:
                default: 2m
                description: |-
                  unhealthyDuration is the hysteresis threshold: a condition must stay
                  unhealthy this long before the node is remediated. Short blips are ignored.
                type: string
            required:
            - nodeSelector
            - unhealthyConditions
            type: object
          status:
            description: status defines the observed state of RemediationPolicy
            properties:
              conditions:
                description: |-
                  conditions: BlastRadiusLimited is True while unhealthy nodes are
                  waiting because the cap is full.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              matchingNodes:
                description: matchingNodes is how many nodes the selector matches.
                format: int32
                type: integer
              maxConcurrent:
                description: maxConcurrent is the blast-radius cap resolved to a node
                  count.
                format: int32
                type: integer
              nodes:
                description: nodes lists every non-healthy node and where it is in
                  remediation.
                items:
                  description: NodeStatus is one non-healthy node as seen by this
                    policy.
                  properties:
                    attempts:
                      description: attempts is the number of reboot/replace attempts
                        started.
                      format: int32
                      type: integer
                    message:
                      description: message is a human-readable detail.
                      type: string
                    name:
                      description: name of the node.
                      type: string
                    nextRetryTime:
                      description: nextRetryTime is set while in Backoff.
                      format: date-time
                      type: string
                    phase:
                      description: phase in the remediation state machine.
                      type: string
                    reason:
                      description: reason is the unhealthy condition, e.g. "Ready=Unknown".
                      type: string
                    unhealthySince:
                      description: unhealthySince is when the unhealthy condition
                        started.
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              nodesUnderRemediation:
                description: |-
                  nodesUnderRemediation counts nodes in Draining, Rebooting, Backoff or
                  Failed: the nodes that use up the blast-radius budget.
                format: int32
                type: integer
              observedGeneration:
                description: observedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              unhealthyNodes:
                description: unhealthyNodes is how many matching nodes have an unhealthy
                  condition.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
