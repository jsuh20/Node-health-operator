---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - remediation.nodehealth.dev
  resources:
  - remediationpolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - remediation.nodehealth.dev
  resources:
  - remediationpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - remediation.nodehealth.dev
  resources:
  - remediationpolicies/status
  verbs:
  - get
  - patch
  - update
